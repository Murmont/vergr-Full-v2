    # ── Vergr Admin update channel (2026-09-21) ─────────────────────────────
    # Goes INSIDE the existing `server { server_name sfu.vergr.app; ... }` block
    # in /etc/nginx/sites-enabled/sfu.vergr.app, ABOVE `location / { return 404; }`.
    #
    # /ops/ is served ONLY to a request carrying a live download ticket, and only
    # the operator or an active sub-admin can get one (functions/adminSecurity.js,
    # getMyAdminSecurityStatus). The check is vergr-ops-auth on 127.0.0.1:8099
    # (infra/ops-auth). It never sees a Firebase token.
    #
    # Apply:  nginx -t && systemctl reload nginx
    # Check:  curl -s -o /dev/null -w '%{http_code}\n' https://sfu.vergr.app/ops/admin/latest.json   → 401
    location /ops/ {
        auth_request /_ops_auth;
        alias /opt/vergr-ops/public/;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location = /_ops_auth {
        internal;
        proxy_pass http://127.0.0.1:8099/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Original-URI $request_uri;
        proxy_read_timeout 5s;
    }

    # APPLIED 2026-09-21. The two tournament OCR proxies (/ocr-internal/ and = /frame)
    # were removed from the site file in the same change (vergr-ocr is stopped).
    # Backup of the previous file: /root/nginx-backups/sfu.vergr.app.2026-09-21.bak
    # ── Vergr Vanguard update channel (2026-09-21) ──────────────────────────
    # Same lock as /ops/admin/: auth_request with a SCOPED ticket (a Vanguard
    # ticket opens only this path). CORS is for the member-only download page at
    # https://vergr.app/vanguard, which fetches with an Authorization header; the
    # preflight carries no ticket, so it is answered here without auth. The
    # installer itself is still refused without a live ticket.
    location /ops/vanguard/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://vergr.app" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization" always;
            add_header Access-Control-Max-Age 600 always;
            add_header Vary Origin always;
            return 204;
        }
        auth_request /_ops_auth;
        alias /opt/vergr-ops/public/vanguard/;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Access-Control-Allow-Origin "https://vergr.app" always;
        add_header Access-Control-Expose-Headers "Content-Length" always;
        add_header Vary Origin always;
    }

