    # ── Creator payouts: Mercury relay (written 2026-09-24, NOT APPLIED) ────
    # Goes INSIDE the existing `server { server_name sfu.vergr.app; ... }` block
    # in /etc/nginx/sites-enabled/sfu.vergr.app, ABOVE `location / { return 404; }`.
    #
    # Callers are Cloud Functions presenting a Google OIDC identity token; the
    # relay itself verifies it (infra/mercury-relay/server.cjs). nginx only adds TLS.
    #
    # Apply:  back up the site file, add this block, nginx -t && systemctl reload nginx
    # Check:  curl -s https://sfu.vergr.app/payouts/healthz                      -> {"ok":true,...}
    #         curl -s -o /dev/null -w '%{http_code}\n' -X POST https://sfu.vergr.app/payouts/v1/accounts   -> 401
    location /payouts/ {
        proxy_pass http://127.0.0.1:8098;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        client_max_body_size 16k;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        access_log off;
    }
