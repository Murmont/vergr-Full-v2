[package]
name = "vergr-desktop"
version = "1.0.1"
description = "VERGR — Where Gamers Converge (Desktop)"
authors = ["Vergr"]
edition = "2021"

[lib]
name = "vergr_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
url = "2"
rand = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
sysinfo = "0.31"
sha2 = "0.10"
hex = "0.4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
