<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VERGR" />
    <link rel="icon" type="image/png" href="/favicon-v2.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-v2.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192-v2.png" />
    <meta name="theme-color" content="#07080D" />
    <meta name="description" content="VERGR — Where gamers converge. Compete in skill-based tournaments for real prizes, stream gameplay and earn tips, build a squad with shared treasury. The gaming social platform built for monetisation." />
    <!-- Cryptomus merchant domain ownership verification. Keep until
         Cryptomus confirms verification, after which it can be removed. -->
    <meta name="cryptomus" content="a3067f24" />
    <title>VERGR — Where Gamers Converge | Tournaments, Streaming, Squads</title>

    <!-- Structured data for search engines: Organization + WebSite. Helps
         Google understand VERGR is a software product / community, not a
         random gambling site, and improves rich-snippet eligibility. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "VERGR",
          "url": "https://vergr.app",
          "logo": "https://vergr.app/brand/logo.png",
          "description": "VERGR is a skill-based competitive gaming social platform with live streaming, organised tournaments, squad communities, and a creator economy.",
          "sameAs": [],
          "contactPoint": {
            "@type": "ContactPoint",
            "email": "support@vergr.app",
            "contactType": "customer support",
            "availableLanguage": ["English"]
          }
        },
        {
          "@type": "WebSite",
          "name": "VERGR",
          "url": "https://vergr.app",
          "description": "Compete in skill-based gaming tournaments, stream gameplay, build squads, and earn real money. Crypto and card payments supported.",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://vergr.app/#/help?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
    <!-- Open Graph / link preview defaults. Per-post variants are served by
         the shareLink Cloud Function so messengers (WhatsApp, Discord, etc.)
         get the right title + image + description for shared URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VERGR" />
    <meta property="og:title" content="VERGR — Where Gamers Make Money | Tournaments, Streaming, Squads" />
    <meta property="og:description" content="Turn your gaming skill into real money. Skill-based tournaments with cash prizes, live streaming with tips, squad communities with shared treasuries. Crypto and card supported." />
    <meta property="og:image" content="https://vergr.app/icons/icon-512.png" />
    <meta property="og:url" content="https://vergr.app" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VERGR — Where Gamers Make Money" />
    <meta name="twitter:description" content="Skill-based tournaments, live streaming, squads. Turn your gaming into earnings — no ads, flat 10% tip fee, crypto cash-out." />
    <meta name="twitter:image" content="https://vergr.app/icons/icon-512.png" />
    <link rel="canonical" href="https://vergr.app/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
    <style>
      /* Material Symbols — SELF-HOSTED first so icons never fall back to raw
         ligature text (offline, CSP, CDN-404, or slow network). The bundled
         /fonts file ships inside the desktop app; the CDN URL is a secondary
         source only. font-display:block hides glyphs until the font is ready
         instead of flashing the ligature names. */
      @font-face {
        font-family: 'Material Symbols Outlined';
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url(/fonts/material-symbols-outlined.woff2) format('woff2'),
             url(https://fonts.gstatic.com/s/materialsymbolsoutlined/v341/kJEhBvYX7BgnkSrUwT8OhrdQw4oELdPIeeII9v6oFsI.woff2) format('woff2');
      }
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined';
        font-weight: normal;
        font-style: normal;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-feature-settings: 'liga';
        -webkit-font-smoothing: antialiased;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { height: 100%; width: 100%; }
      body { background: #07080D; color: #ECEFFE; font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; }
      ::-webkit-scrollbar { width: 0; height: 0; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      .text-gradient { background: linear-gradient(135deg, #4DFFD4 0%, #7B6FFF 50%, #C87FFF 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
      /* Engagement animations */
      @keyframes slide-down { from { transform: translateY(-100%) translateX(-50%); opacity:0; } to { transform: translateY(0) translateX(-50%); opacity:1; } }
      .animate-slide-down { animation: slide-down 0.35s cubic-bezier(0.25,0.1,0.25,1) forwards; }
      @keyframes shimmer { from { background-position: -200% 0; } to { background-position: 200% 0; } }
      .animate-shimmer { background: linear-gradient(90deg, transparent 0%, rgba(81,251,217,0.05) 50%, transparent 100%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
      /* Safe area padding for notched phones */
      .safe-top { padding-top: env(safe-area-inset-top, 0px); }
      .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
      .gold-text { background: linear-gradient(135deg, #F5C542 0%, #D4A017 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
      input:-webkit-autofill { -webkit-box-shadow: 0 0 0 30px #161922 inset !important; -webkit-text-fill-color: #ECEFFE !important; }
    </style>
    <!-- Tebex.js — inline checkout modal for the Headless API integration.
         Loaded async; src/utils/tebexCheckout.js calls window.Tebex once available. -->
    <script src="https://js.tebex.io/v/1.js" async></script>
  </head>
  <body>
    <script>
      (function() {
        var t = 'dark';
        try { t = localStorage.getItem('vergr_theme') || 'dark'; } catch(e) {}
        var resolved = t;
        if (t === 'system') {
          resolved = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', resolved);
        document.documentElement.className = resolved;
        if (resolved === 'light') {
          document.body.style.background = '#F4F4F5';
          document.body.style.color = '#09090B';
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  <script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js").then(reg=>{reg.update();});}</script>
  </body>
</html>
