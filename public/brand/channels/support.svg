<!--
  Vergr Support channel avatar.

  Built to docs/CHANNEL_SEED.md section 2: "a speech bubble with a question
  mark, white, on a soft violet-light gradient (#B44FFF to #7B1FFF)", and
  explicitly NOT a warning triangle or anything red, because this channel also
  carries account notices and the avatar must not pre-announce bad news.

  Follows the constraints in that spec: one bold motif, no text (unreadable at
  the 34px admin size), flat rather than photographic, motif kept inside the
  middle ~80% so the circular mask does not clip it, and designed to sit on the
  #0B0B14 list background rather than glowing as a white square.

  SVG rather than the 512x512 WebP the spec asks for: that requirement is about
  art uploaded through the channel editor, which routes via the R2 announcement
  kind. This is a repo asset served from the same origin, and a vector costs
  ~1KB, stays sharp at every one of the three render sizes, and needs no export
  step. Replace it by setting `avatarUrl` on the channel doc if real art lands.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Vergr Support">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B44FFF"/>
      <stop offset="1" stop-color="#7B1FFF"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="256" fill="url(#bg)"/>

  <!-- Speech bubble, white, centred. Tail bottom-left so the mark reads as
       conversation rather than a generic rounded square. -->
  <path
    fill="#FFFFFF"
    d="M256 128c-70.7 0-128 47.4-128 105.9 0 33.2 18.5 62.8 47.4 82.2v46.2c0 6.6 7.5 10.4 12.8 6.5l45.9-33.6c7.2 1 14.6 1.6 21.9 1.6 70.7 0 128-47.4 128-102.9S326.7 128 256 128z"
  />

  <!-- Question mark, knocked out of the bubble in the gradient colour so it
       reads at 34px without a second fill colour entering the palette. -->
  <path
    fill="#7B1FFF"
    d="M256 186c-29.3 0-51 17.2-51 42.5 0 8.3 6.7 15 15 15s15-6.7 15-15c0-8.4 8.6-12.5 21-12.5s21 5 21 13.2c0 6.6-3.4 10.3-13.6 17.1-11.9 7.9-22.4 16.8-22.4 32.7v4c0 8.3 6.7 15 15 15s15-6.7 15-15v-4c0-2.7 3.1-5.6 11.4-11.1 11.4-7.6 24.6-17.6 24.6-38.7 0-25-21.4-43.2-51-43.2z"
  />
  <circle cx="256" cy="316" r="16" fill="#7B1FFF"/>
</svg>
